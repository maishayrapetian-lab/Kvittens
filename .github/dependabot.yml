version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    groups:
      python-runtime:
        patterns:
          - streamlit
          - anthropic
          - pandas
          - openpyxl
          - pillow
          - pillow-heif
      python-tooling:
        patterns:
          - pytest
          - ruff
